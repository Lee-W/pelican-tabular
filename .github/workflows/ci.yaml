name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
          version: "latest"

      - name: Install Python
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --locked --no-sources --python ${{ matrix.python-version }}

      - name: Lint
        run: uv run poe lint

      - name: Test
        run: uv run poe cover

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
          version: "latest"
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: uv sync --locked --no-sources --group dev
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run example
      - run: uv run python scripts/build_browser_fixtures.py
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: database-browser-results
          path: test-results/
